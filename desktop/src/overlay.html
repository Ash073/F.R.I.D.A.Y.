<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scanlines"></div>

  <div id="big-orb-container">
    <iframe id="orbIframe" src="../cinematic-ai-core/dist/index.html" frameborder="0" scrolling="no" style="width:100%; height:100%; border:none; pointer-events:none; background:transparent;"></iframe>
  </div>

  <div id="bar">
    <!-- CENTER: INPUT WITH RUNNING SUGGESTIONS -->
    <div id="center">
      <input id="cmdInput" placeholder="Initiating F.R.I.D.A.Y..." spellcheck="false" autocomplete="off" />
      <div id="status">Online</div>
    </div>

    <!-- RIGHT CONTROLS -->
    <div id="controls">
      <!-- Voice Assist Button -->
      <button id="voiceBtn" title="Voice Assist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      
      <!-- Close -->
      <button id="closeBtn" title="Dismiss">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M3 3L13 13M3 13L13 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="utils/fridayFetch.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
