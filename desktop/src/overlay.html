<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="scanlines"></div>

  <div id="big-orb-container">
    <iframe id="orbIframe" src="../cinematic-ai-core/dist/index.html" frameborder="0" scrolling="no" style="width:100%; height:100%; border:none; pointer-events:none; background:transparent;"></iframe>
  </div>

  <div id="bar">
    <!-- CENTER: INPUT WITH RUNNING SUGGESTIONS -->
    <div id="center">
      <input id="cmdInput" placeholder="Initiating F.R.I.D.A.Y..." spellcheck="false" autocomplete="off" />
      <div id="status">Online</div>
    </div>

    <!-- RIGHT CONTROLS -->
    <div id="controls">
      <!-- Voice Assist Button -->
      <button id="voiceBtn" title="Voice Assist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      
      <!-- Close -->
      <button id="closeBtn" title="Dismiss">
        <svg width="18" height="18" viewBox="0 0 16 16">
          <path d="M3 3L13 13M3 13L13 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- SPOTIFY WIDGET -->
  <div id="spotify-widget">
    <div class="sp-top-row">
      <svg class="sp-icon" viewBox="0 0 24 24" width="14" height="14" fill="#1DB954">
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424c-.18.295-.565.387-.86.207-2.377-1.454-5.37-1.783-8.893-.982-.336.075-.668-.135-.744-.47-.076-.336.135-.668.47-.743 3.856-.88 7.15-.506 9.822 1.13.295.178.387.563.207.858zm1.225-2.72c-.227.367-.707.487-1.074.26-2.72-1.672-6.87-2.157-10.075-1.183-.413.125-.847-.107-.972-.52-.125-.413.107-.847.52-.972 3.666-1.11 8.237-.574 11.34 1.33.368.228.488.708.26 1.076zm.107-2.833C14.384 8.78 8.567 8.587 5.2 9.61c-.547.165-1.12-.143-1.285-.69-.165-.547.143-1.12.69-1.285 3.864-1.173 10.288-.95 14.34 1.455.49.292.65.925.358 1.416-.29.49-.925.65-1.417.357z"/>
      </svg>
      <span class="sp-title">NOW PLAYING</span>
    </div>
    <div class="sp-body">
      <img id="sp-album-art" src="" alt="" />
      <div class="sp-info">
        <div id="sp-track-name">Track Name</div>
        <div id="sp-artist-name">Artist Name</div>
      </div>
    </div>
    <div class="sp-progress-bar">
      <div class="sp-progress-fill"></div>
    </div>
    <div class="sp-controls">
      <button id="sp-prev">⏮</button>
      <button id="sp-play-pause">⏯</button>
      <button id="sp-next">⏭</button>
    </div>
    <div class="sp-footer">FRIDAY AUDIO ENGINE</div>
  </div>

  <!-- FRIDAY SPOTIFY WIDGET -->
  <div id="sp-widget">

    <div class="sp-header">
      <span class="sp-dot"></span>
      <span class="sp-now-playing">NOW PLAYING</span>
      <span class="sp-brand">FRIDAY HUD</span>
    </div>

    <div class="sp-body">
      <img id="sp-art" src="" alt="album art" width="56" height="56" />
      <div class="sp-info">
        <div id="sp-track">—</div>
        <div id="sp-artist">—</div>
        <div class="sp-progress-wrap">
          <div class="sp-progress-bg">
            <div class="sp-progress-fill" id="sp-fill"></div>
          </div>
          <div class="sp-time">
            <span id="sp-elapsed">0:00</span>
            <span id="sp-total">0:00</span>
          </div>
        </div>
      </div>
    </div>

    <div class="sp-controls">
      <button id="sp-prev-hud" title="Previous">⏮</button>
      <button id="sp-playpause-hud" title="Play/Pause">⏸</button>
      <button id="sp-next-hud" title="Next">⏭</button>
    </div>

    <div class="sp-footer">FRIDAY AUDIO ENGINE &nbsp;·&nbsp; STREAM LIVE</div>

  </div>

  <!-- ════════════════════════════════════════ -->
  <!-- TASK 1 — CHAT SCREEN OVERLAY -->
  <!-- ════════════════════════════════════════ -->
  <div id="friday-chat-screen">
    
    <!-- HEADER BAR -->
    <div class="chat-header">
      <div class="chat-header-left">
        <button id="chat-back-btn">← FRIDAY</button>
      </div>
      <div class="chat-header-center">
        <div class="chat-title">F.R.I.D.A.Y. INTELLIGENCE</div>
        <div id="chat-ai-status">INTELLIGENCE ONLINE</div>
      </div>
      <div class="chat-header-right">
        <div class="chat-mode-wrapper">
          <select id="chat-mode-select">
            <option value="AUTO">AUTO</option>
            <option value="GEMINI">GEMINI</option>
            <option value="GROQ">GROQ</option>
            <option value="COHERE">COHERE</option>
            <option value="MERGED">MERGED</option>
          </select>
        </div>
        <button id="chat-clear-btn">CLEAR</button>
      </div>
    </div>

    <!-- MESSAGES AREA -->
    <div id="chat-messages">
      <!-- Typing Indicator -->
      <div id="chat-typing" class="chat-msg chat-msg-ai" style="display: none;">
        <div class="chat-msg-label">
          <span class="chat-msg-dot"></span>
          <span class="chat-msg-friday">FRIDAY</span>
          <span class="chat-msg-sep">·</span>
          <span class="chat-msg-engine">THINKING</span>
        </div>
        <div class="chat-msg-content">
          <div class="chat-typing-dots">
            <span class="chat-dot"></span>
            <span class="chat-dot"></span>
            <span class="chat-dot"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- FILE ATTACHMENT PREVIEW AREA -->
    <div id="chat-attachments" style="display: none;"></div>

    <!-- INPUT AREA -->
    <div class="chat-input-area">
      <div class="chat-input-container">
        
        <!-- ROW 1 — Attachment action buttons -->
        <div class="chat-input-row-actions">
          <button id="chat-attach-btn">📎 FILE</button>
          <button id="chat-image-btn">🖼 IMAGE</button>
          <input type="file" id="chat-file-input" style="display: none;" />
        </div>

        <!-- ROW 2 — Main input row -->
        <div class="chat-input-row-main">
          <textarea id="chat-input" placeholder="Ask FRIDAY anything..." rows="1"></textarea>
          <button id="chat-send-btn">➤</button>
        </div>

        <!-- Below input row — tiny hint text -->
        <div class="chat-input-hint">
          FRIDAY may make mistakes · Powered by Gemini · Groq · Cohere · Mistral
        </div>
      </div>
    </div>

  </div>

  <script src="utils/fridayFetch.js"></script>
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="overlay.js"></script>
  <script src="utils/fridayChat.js"></script>
  <script src="utils/fridayAgentUI.js"></script>
  <script src="./utils/voiceEnrollment.js"></script>
  <script src="./utils/wakeWord.js"></script>
</body>
</html>
